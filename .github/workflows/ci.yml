name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.10" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Import every module without SolidWorks
        run: python -m compileall -q src

      - name: Run the suite
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade ruff

      # Deliberately narrow: syntax errors, undefined names, unused imports in
      # asserts and f-string bugs. This is a correctness gate, not a style vote.
      - name: Check for errors ruff can prove
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

  guard:
    name: guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          title = os.environ["TITLE"].strip()
          ok = re.match(r"^(feat|fix|test|docs|refactor|perf|build|ci|chore)(\([^)]+\))?!?: .{8,}", title)
          if not ok:
              print(f"::error::PR title must read 'type(scope): what changed' - got {title!r}")
              sys.exit(1)
          print(f"title ok: {title}")
          PY

      - name: Things that must never reach main
        run: |
          python3 - <<'PY'
          import subprocess, sys
          base = subprocess.run(["git", "merge-base", "origin/${{ github.base_ref }}", "HEAD"],
                                capture_output=True, text=True, check=True).stdout.strip()
          diff = subprocess.run(["git", "diff", "-U0", base, "HEAD"],
                                capture_output=True, text=True, check=True).stdout
          # Each needle is assembled from pieces on purpose: written whole, this
          # file would match itself and the first PR that adds it would fail.
          bad = {
              "conflict marker": ("<" * 7 + " ", ">" * 7 + " "),
              "debugger": ("breakpoint" + "()", "pdb" + ".set_trace()", "import " + "pdb"),
              "private key": ("-----BEGIN " + "RSA PRIVATE KEY-----",
                              "-----BEGIN " + "OPENSSH PRIVATE KEY-----"),
              "github token": ("github" + "_pat_", "gh" + "p_"),
          }
          added = [l[1:] for l in diff.splitlines() if l.startswith("+") and not l.startswith("+++")]
          hits = [(name, needle, line) for name, needles in bad.items()
                  for needle in needles for line in added if needle in line]
          changed = sum(1 for l in diff.splitlines() if l.startswith("+") and not l.startswith("+++"))
          for name, needle, line in hits:
              print(f"::error::{name} in added line: {line.strip()[:120]}")
          if hits:
              sys.exit(1)
          if changed > 600:
              print(f"::error::this PR adds {changed} lines; split it up or get a human to sign off")
              sys.exit(1)
          print(f"guard ok: {changed} added lines, no forbidden content")
          PY

  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, lint, guard]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo "test=${{ needs.test.result }} lint=${{ needs.lint.result }} guard=${{ needs.guard.result }}"
          for r in "${{ needs.test.result }}" "${{ needs.lint.result }}" "${{ needs.guard.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not succeed"; exit 1 ;;
            esac
          done
